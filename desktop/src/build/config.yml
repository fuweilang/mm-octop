# This file contains the configuration for this project.
# When you update `info`, run `wails3 task common:update:build-assets` to refresh generated assets.
# `info.version` is a fallback for local `wails3 generate`; release packaging stamps
# pyproject.toml's version onto the .app / exe / NSIS metadata.
version: "3"

info:
  companyName: "猛犸AI"
  # Display / package name must stay 猛犸智能体 (no alternate 猛犸AI app name).
  # Installers should overwrite the same productIdentifier so leftover
  # "猛犸AI" shells with com.tencent.octop do not sit beside this build.
  productName: "猛犸智能体"
  productIdentifier: "com.tencent.octop"
  description: "猛犸智能体"
  copyright: "(c) 2026, 猛犸AI"
  comments: "猛犸智能体"
  version: "1.1.0"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
      - assets
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 task common:install:frontend:deps
      type: once
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: go mod tidy
      type: blocking
    - cmd: wails3 task build
      type: blocking
    - cmd: wails3 task run
      type: primary

fileAssociations: []
