<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>猛犸AI</title>
    <script>
      document.documentElement.dataset.chrome = /Mac|iPhone|iPad/.test(
        navigator.userAgent,
      )
        ? "mac"
        : "windows";
      var macChrome = document.documentElement.dataset.chrome === "mac";
      document.documentElement.style.setProperty(
        "--window-controls-inset-end",
        macChrome ? "0px" : "138px",
      );
      document.documentElement.style.setProperty(
        "--window-controls-inset-start",
        macChrome ? "80px" : "0px",
      );
      if (new URLSearchParams(location.search).get("settings") === "1") {
        document.documentElement.dataset.mode = "settings";
        document.documentElement.style.setProperty(
          "--window-controls-inset-end",
          macChrome ? "0px" : "36px",
        );
        document.documentElement.style.setProperty(
          "--window-controls-inset-start",
          macChrome ? "36px" : "0px",
        );
      }
    </script>
    <script type="module" src="/wails/runtime.js"></script>
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body>
    <div class="window-chrome octop-desktop-drag" id="window-chrome"></div>
    <div
      class="window-controls ctrl-mac"
      data-chrome="mac"
      data-octop-no-drag="true"
      aria-label="窗口控制"
    >
      <button
        type="button"
        class="light close"
        data-action="close"
        aria-label="关闭"
      >
        <span class="glyph" aria-hidden>×</span>
      </button>
      <button
        type="button"
        class="light min"
        data-action="minimise"
        aria-label="最小化"
      >
        <span class="glyph" aria-hidden>–</span>
      </button>
      <button
        type="button"
        class="light zoom"
        data-action="toggle-maximise"
        aria-label="最大化"
      >
        <span class="glyph" aria-hidden>+</span>
      </button>
    </div>
    <div
      class="window-controls ctrl-win"
      data-chrome="windows"
      data-octop-no-drag="true"
      aria-label="Window controls"
    >
      <button type="button" class="win-btn" data-action="minimise" aria-label="Minimize">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M5 12h14" />
        </svg>
      </button>
      <button
        type="button"
        class="win-btn"
        data-action="toggle-maximise"
        aria-label="Maximize"
      >
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="2" />
        </svg>
      </button>
      <button
        type="button"
        class="win-btn win-close"
        data-action="close"
        aria-label="Close"
      >
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M18 6 6 18" />
          <path d="m6 6 12 12" />
        </svg>
      </button>
    </div>

    <div class="loading" id="loading-panel">
      <div class="loading-card">
        <img
          id="mascot"
          src="/mengma-logo.png"
          alt="猛犸AI"
          draggable="false"
        />
        <p class="loading-brand" id="loading-brand">猛犸AI</p>
        <p class="loading-hint" id="loading-hint">
          正在检查运行环境，可能需要几分钟。
        </p>
        <div class="loading-footer">
          <div class="loading-bar" role="progressbar" aria-hidden="true">
            <span class="loading-bar-fill"></span>
          </div>
          <p class="loading-status" id="status">正在启动，请稍候…</p>
          <button class="alt-port hidden" id="alt-port" type="button">
            换端口启动（需重新登录）
          </button>
        </div>
      </div>
    </div>

    <div id="settings-panel" class="hidden">
      <div class="wrap">
        <h1 id="title">猛犸智能体 设置</h1>
        <p class="subtitle" id="subtitle">桌面端偏好</p>
        <div class="card">
          <div class="row">
            <div>
              <div class="label" id="l-lang">语言 / Language</div>
              <small id="h-lang"
                >选择偏好语言 / Choose your preferred language</small
              >
            </div>
            <select id="locale">
              <option value="zh">中文</option>
              <option value="en">English</option>
            </select>
          </div>
          <div class="row">
            <div>
              <div class="label" id="l-auto">开机启动</div>
              <small id="h-auto">登录系统后自动启动</small>
            </div>
            <label class="switch">
              <input type="checkbox" id="autostart" />
              <span></span>
            </label>
          </div>
          <div class="row">
            <div>
              <div class="label" id="l-tray">最小化到托盘</div>
              <small id="h-tray"
                >点击最小化时隐藏窗口并保留在系统托盘</small
              >
            </div>
            <label class="switch">
              <input type="checkbox" id="tray" />
              <span></span>
            </label>
          </div>
          <div class="row">
            <div>
              <div class="label" id="l-sleep">防止系统休眠</div>
              <small id="h-sleep">应用运行期间阻止系统自动休眠</small>
            </div>
            <label class="switch">
              <input type="checkbox" id="sleep" />
              <span></span>
            </label>
          </div>
          <div class="row hidden" id="legacy-row">
            <div>
              <div class="label" id="l-legacy">旧版「猛犸AI」</div>
              <small id="h-legacy"
                >检测到仍安装，旧版会抢先占用 8088。建议卸载旧版。</small
              >
            </div>
            <button class="row-action" id="legacy-reveal" type="button">
              定位旧版
            </button>
          </div>
        </div>
        <div class="actions">
          <button class="primary" id="show-main">显示猛犸AI</button>
          <button class="ghost" id="quit">退出</button>
        </div>
        <p class="status hidden" id="settings-status"></p>
      </div>
    </div>
    <script type="module" src="/index.js"></script>
  </body>
</html>
